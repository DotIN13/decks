<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Card measure</title>
		<!-- One card (or page), laid out at its own width for the server to measure when no canvas has (`src/measure.ts`, `server/stage/shots.ts`). -->
		<style>
			html,
			body {
				margin: 0;
				background: #fff;
			}
			iframe {
				display: block;
				border: 0;
			}
		</style>
		<!-- The libraries a card imports by name, as on the app's page and the canvas frame (`index.html`, `canvas-frame.html`). -->
		<script type="importmap">
			{
				"imports": {
					"d3": "/vendor/d3.mjs",
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
					"gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/+esm",
					"chart.js": "https://cdn.jsdelivr.net/npm/chart.js@4.5.1/+esm"
				}
			}
		</script>
	</head>
	<body>
		<script type="module" src="/src/pages/measure.ts"></script>
	</body>
</html>
