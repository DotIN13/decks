name: test

# What this runs, and what it deliberately does not.
#
# **typecheck, the unit tests, and the browser checks.** The browser checks were cut
# from forty-five *for this*: the suite has to be fast enough to run on every push, and at
# ~2 minutes over a throwaway copy of `example/` it is. The checks that need a model are
# not run here — they cost tokens against somebody's account, and a red build that means
# "the API key expired" is a build people learn to ignore.
#
# `npm ci --include=dev`, because the whole toolchain (TypeScript, tsx, Vite, Playwright) is
# a devDependency: nothing here is published and everything here is built.
#
# Chromium is cached separately, because `cache: npm` below caches npm's cache directory
# and **not** `~/.cache/ms-playwright`. It is ~100MB, and a run that downloads it takes
# about forty seconds longer than one that does not. It is installed before the unit tests
# as well as before the browser checks, because some unit tests measure a real page.
#
# Nothing here needs a third-party agent CLI: the opencode tests build their own fake child
# process, so a machine with no opencode on it still runs every server test.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `engines.node` says >=22.19, and 22.18 is where Node strips TypeScript types by
      # itself — which is how the `.mjs` browser checks import `@decks/protocol` and
      # `@decks/board-kit` with no build step at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci --include=dev

      # One command over every workspace: the two apps, the protocol, the board vocabulary,
      # the runtime assets, the extension and the browser checks. A workspace added to the
      # root `package.json` with a `typecheck` script is covered by this line and nothing
      # else — which is the reason it is `--workspaces` rather than a list of four.
      - run: npm run typecheck

      # **The cascade gate, on its own line, and before the tests.** The app's 13 stylesheets
      # are all inside `@layer components`, so which rule wins a tie is decided by the order
      # they are flattened in — and `npm test` and `npm run test:e2e` both measure elements,
      # not rules, so a rule dragged past another can turn a check green while changing the
      # page. `scripts/css-order.mjs` hashes that order against the committed baseline; it is
      # its own step so the log says "the order moved" instead of burying it in a test list.
      - run: npm run css:order

      # **Before the unit tests, not after.** Three files in `apps/server` drive a real page —
      # `web/bridge.test.ts` over the extension's socket, and two in `app.test.ts` that measure a
      # frame and write the number back — so `npm test` needs a browser. This step used to come
      # after it, which is why the build was red for its first three pushes, with nineteen
      # failures that were all "no browser here".
      #
      # Keyed on the lockfile rather than on Playwright's version, so a dependency bump
      # that changes the browser build gets a fresh cache instead of a stale one. The cost
      # of over-invalidating is one download; the cost of under-invalidating is a test run
      # against a browser nobody expects.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # A no-op when the cache hit, which is the point.
      - run: npx playwright install --with-deps chromium

      # Every workspace, with no browser needed to start one and no model to pay for: the seven
      # opencode tests bring their own fake child process, so nothing here needs an opencode
      # binary on the machine — see the flag that makes that true in `opencode/manager.ts`.
      - run: npm test

      # Its own server, on its own ports, over its own copy of `example/` — so this needs
      # nothing running first, and it cannot touch a deck somebody is working in.
      - run: npm run test:e2e
