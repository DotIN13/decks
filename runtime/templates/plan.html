<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
	</head>
	<body class="board">
		<div class="text" data-id="heading" style="left: 48px; top: 40px; width: 900px">
			<h1 data-edit="heading-title">{{TITLE}}</h1>
		</div>

		<section class="card" data-id="goal" style="left: 48px; top: 152px; width: 380px">
			<h3 data-edit="goal-title">Goal</h3>
			<p data-edit="goal-body">One sentence that would survive being read out loud.</p>
		</section>

		<section class="card" data-id="approach" style="left: 476px; top: 152px; width: 380px">
			<h3 data-edit="approach-title">Approach</h3>
			<p data-edit="approach-body">…</p>
		</section>

		<section class="card" data-id="steps" style="left: 48px; top: 420px; width: 808px">
			<h3 data-edit="steps-title">Steps</h3>
			<ol>
				<li data-edit="steps-1">…</li>
			</ol>
		</section>

		<!--
			If a step needs a picture rather than a paragraph, draw it: one component that
			owns its boxes and the arrows between them, at coordinates you chose. There is
			no connector between two components, on purpose — a line placed at mount time
			is not in the file, so nobody can read it or edit it. See board-authoring.
		-->

		<script src="../lib/board.js"></script>
	</body>
</html>
