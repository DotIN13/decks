<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
	</head>
	<body class="board">
		<!--
			The number first, then how and what, then what is left.

			The headline used to sit in a third column beside method and result, which read
			left → right → back → down and put the one thing worth seeing where the eye
			arrives last. It is the executive summary: it goes at the top, full width, and
			the file reads in the order the page does.
		-->
		<div class="text" data-id="heading" style="left: 48px; top: 40px; width: {{CONTENT}}px">
			<h1>{{TITLE}}</h1>
			<p style="color: var(--b-muted)">What was done, and what it means.</p>
			<!--
				Replace that line with the finding, in a sentence somebody could repeat. It is
				the most-read text on the board and "what was done, and what it means" is a
				label for the shape rather than a thing you learned.
			-->
		</div>

		<!-- The number that matters, before anything that explains it. -->
		<div class="kpi" data-id="headline" style="left: 48px; top: {{ROW1}}px; width: {{CONTENT}}px">
			<span class="value">—</span>
			<span class="label">the number that matters</span>
		</div>

		<!--
			Method: how, briefly. **Not a log.**
			
			Two or three steps somebody could repeat, in the shortest words that are still
			true. What you tried and abandoned belongs here only if the abandoning is the
			finding.
		-->
		<section class="card" data-id="method" style="left: 48px; top: {{ROW2}}px; width: {{COL}}px">
			<h4>Method</h4>
			<ol>
				<li>…</li>
			</ol>
		</section>

		<!-- Result: what changed, said as a number wherever there is one to say. -->
		<section class="card" data-id="result" style="left: {{COLX}}px; top: {{PAIRB}}px; width: {{COL}}px">
			<h4>Result</h4>
			<p>…</p>
		</section>

		<!-- What is left, if anything. Say "nothing" rather than deleting it. -->
		<div class="callout" data-id="left" data-tone="warn" style="left: 48px; top: {{ROW3}}px; width: {{CONTENT}}px">
			<strong>Left to do.</strong> <span>…</span>
		</div>

		<script src="../lib/board.js"></script>
	</body>
</html>
