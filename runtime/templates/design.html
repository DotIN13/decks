<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
	</head>
	<body class="board">
		<div class="text" data-id="heading" style="left: 48px; top: 40px; width: 900px">
			<h1 data-edit="heading-title">{{TITLE}}</h1>
			<p data-edit="heading-line" style="color: var(--b-muted)">What is being decided, in one line.</p>
		</div>

		<!-- The options, as columns of the same width and top. -->
		<section class="card" data-id="option-a" style="left: 48px; top: 168px; width: 380px">
			<h3 data-edit="option-a-title">Option A</h3>
			<p data-edit="option-a-body">…</p>
		</section>
		<section class="card" data-id="option-b" style="left: 476px; top: 168px; width: 380px">
			<h3 data-edit="option-b-title">Option B</h3>
			<p data-edit="option-b-body">…</p>
		</section>

		<!-- The recommendation, said plainly, in a callout so the eye lands on it. -->
		<div class="callout" data-id="recommendation" style="left: 48px; top: 520px; width: 808px">
			<strong data-edit="recommendation-label">Recommendation.</strong> <span data-edit="recommendation-body">…</span>
		</div>

		<script src="../lib/board.js"></script>
	</body>
</html>
