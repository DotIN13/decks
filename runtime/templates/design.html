<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
	</head>
	<body class="board">
		<!--
			Read top to bottom: what is being decided, the options side by side, then the
			answer. The file is in that order, and within the pair it is left then right —
			so the DOM and the eye agree at any width.

			On a narrow board the pair folds into one column ({{COLX}} becomes 48 and the
			second card drops to {{PAIRB}}), and this file does not change to do it.
		-->
		<div class="text" data-id="heading" style="left: 48px; top: 40px; width: {{CONTENT}}px">
			<h1>{{TITLE}}</h1>
			<p style="color: var(--b-muted)">What is being decided, in one line.</p>
		</div>

		<!--
			The options, as columns of the same width. Left first.
			
			Say what each one *costs*, not what it is. Two cards that describe two designs are
			a pair nobody can choose between; two cards that name the trade-off each one makes
			are a decision. If the options differ along more than two axes, they are a
			`.card.table` with a row per axis rather than a pair of paragraphs.
		-->
		<section class="card" data-id="option-a" style="left: 48px; top: {{ROW1}}px; width: {{COL}}px">
			<h3>Option A</h3>
			<p>…</p>
		</section>
		<section class="card" data-id="option-b" style="left: {{COLX}}px; top: {{PAIRB}}px; width: {{COL}}px">
			<h3>Option B</h3>
			<p>…</p>
		</section>

		<!--
			The recommendation, said plainly, in a callout so the eye lands on it.
			
			Name one, and give the reason in the same breath. "Either could work" is not a
			recommendation; it is the question handed back.
		-->
		<div class="callout" data-id="recommendation" style="left: 48px; top: {{ROW2}}px; width: {{CONTENT}}px">
			<strong>Recommendation.</strong> <span>…</span>
		</div>

		<script src="../lib/board.js"></script>
	</body>
</html>
