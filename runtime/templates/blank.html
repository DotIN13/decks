<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
		{{IMPORTMAP}}
	</head>
	<body class="board">
		<!--
			A heading and nothing else, on purpose.

			Whatever goes under it reads top to bottom and so does the file: one column, or a pair
			at x = 48 and x = {{COLX}} with the left one first. {{CONTENT}} is the full width
			inside the margins.

			Lead with the finding and stop when it is said. A table beats a paragraph about a
			comparison, a diagram beats a paragraph about a structure, a number beats an adjective.
			Then `stage.fit` it, so the board is the size of what is on it rather than the size you
			guessed — and if it needs a chart, the import map in this head can reach one.
		-->
		<div class="text" data-id="heading" style="left: 48px; top: 40px; width: {{CONTENT}}px">
			<h1>{{TITLE}}</h1>
		</div>

		<script src="../lib/board.js"></script>
	</body>
</html>
