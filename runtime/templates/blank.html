<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
	</head>
	<body class="board">
		<!--
			Nothing but a heading, on purpose. What goes under it reads top to bottom, and
			the file should be in that order too; a pair of cards goes at x = 48 and
			x = {{COLX}}, left one first. {{CONTENT}} is the full width inside the margins.

			Whatever you put here, lead with the finding and stop when it is said. A table
			beats a paragraph about a comparison, a diagram beats a paragraph about a
			structure, and a number beats an adjective. Then `stage.fit` it, so the board is
			the size of what is on it rather than the size you guessed.
		-->
		<div class="text" data-id="heading" style="left: 48px; top: 40px; width: {{CONTENT}}px">
			<h1>{{TITLE}}</h1>
		</div>

		<script src="../lib/board.js"></script>
	</body>
</html>
