<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{TITLE}}</title>
		<meta name="board" content='{"w":{{W}},"h":{{H}},"bg":"grid"}' />
		<link rel="stylesheet" href="../lib/board.css" />
		{{IMPORTMAP}}
	</head>
	<body class="board">
		<!--
			The question as a statement, the answer in one sentence, and one thing that shows it.

			`{{TITLE}}` is the title the board was created with. Make it a finding, not a topic:
			"Returning customer share fell after the second tab shipped" and not "Second tab
			analysis". Everything below is an example. Keep the shape, replace the words and numbers.
		-->
		<div class="text" data-id="question" style="left: 48px; top: 40px; width: {{CONTENT}}px">
			<h1>{{TITLE}}</h1>
		</div>

		<!--
			The answer, in one sentence: the thing a reader could repeat out loud and be right
			about. Not the background, not how you found out.
		-->
		<div class="callout" data-id="answer" data-tone="accent" style="left: 48px; top: {{ROW1}}px; width: {{CONTENT}}px">
			<p><b>Share of visits from returning customers fell from 42% in January to 31% in May.</b></p>
		</div>

		<!--
			The evidence, and the only card here that uses the import map.

			The plot has a title saying what it shows, and a title on each axis saying what it
			counts and in what unit. Delete this card if the answer is a comparison (use a
			`.table`), a structure (an `<svg>` you drew) or one number (a `.kpi`). Delete the script
			with it: the script imports d3 only while this element is on the board, so a board
			without the chart never downloads d3.
		-->
		<section class="card" data-id="evidence" style="left: 48px; top: {{ROW2}}px; width: {{CONTENT}}px">
			<h3>Share of customer visits across January to May</h3>
			<div id="chart" style="height: 190px"></div>
			<p style="color: var(--b-muted); font-size: 12px">Example data, five months of one store.</p>
		</section>

		<script type="module">
			/*
			 * The import sits inside `if (host)`, so the library is fetched only while the chart is
			 * on the board. `import("d3")` resolves through the map in this file's head; edit that
			 * map to change the version or to use `three`, `gsap` or `chart.js` instead.
			 *
			 * Every plot gets a title and a titled axis for each direction, because a chart without
			 * them shows a shape and makes no claim. `board:ready` is where to draw when the layout
			 * has to be settled first; here the host has a fixed height, so the board measures the
			 * same before and after the bars appear.
			 */
			const host = document.querySelector("#chart");
			if (host) {
				const d3 = await import("d3");
				const data = [
					{ month: "Jan", share: 0.42 },
					{ month: "Feb", share: 0.38 },
					{ month: "Mar", share: 0.41 },
					{ month: "Apr", share: 0.34 },
					{ month: "May", share: 0.31 },
				];
				const width = host.clientWidth || 600;
				const height = 190;
				const margin = { top: 22, right: 8, bottom: 48, left: 56 };
				const innerW = width - margin.left - margin.right;
				const innerH = height - margin.top - margin.bottom;

				const svg = d3.select(host).append("svg").attr("viewBox", `0 0 ${width} ${height}`).attr("width", "100%").attr("height", height);
				const plot = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

				const x = d3.scaleBand().domain(data.map((d) => d.month)).range([0, innerW]).padding(0.34);
				const y = d3.scaleLinear().domain([0, 0.5]).range([innerH, 0]);

				// The values the bars are read against, and a rule per tick.
				plot.append("g")
					.call(d3.axisLeft(y).ticks(4).tickFormat(d3.format(".0%")).tickSize(-innerW))
					.style("color", "var(--b-muted)")
					.call((axis) => axis.selectAll("text").style("font-size", "11px"))
					.call((axis) => axis.selectAll("line").style("stroke", "var(--b-border)"))
					.call((axis) => axis.select(".domain").style("stroke", "none"));

				// The months, under the bars.
				plot.append("g")
					.attr("transform", `translate(0,${innerH})`)
					.call(d3.axisBottom(x).tickSize(0))
					.style("color", "var(--b-muted)")
					.call((axis) => axis.selectAll("text").style("font-size", "11px").attr("dy", "1.6em"))
					.call((axis) => axis.select(".domain").style("stroke", "var(--b-border-strong)"));

				plot.selectAll("rect")
					.data(data)
					.join("rect")
					.attr("x", (d) => x(d.month))
					.attr("y", (d) => y(d.share))
					.attr("width", x.bandwidth())
					.attr("height", (d) => y(0) - y(d.share))
					.attr("rx", 3)
					.style("fill", "var(--b-accent)");

				// What each axis is, in words, with the unit.
				plot.append("text")
					.attr("x", 0)
					.attr("y", -8)
					.attr("text-anchor", "start")
					.style("font-size", "11px")
					.style("fill", "var(--b-muted)")
					.text("share of visits, percent");
				plot.append("text")
					.attr("x", innerW / 2)
					.attr("y", innerH + 38)
					.attr("text-anchor", "middle")
					.style("font-size", "11px")
					.style("fill", "var(--b-muted)")
					.text("calendar month");
			}
		</script>

		<script src="../lib/board.js"></script>
	</body>
</html>
