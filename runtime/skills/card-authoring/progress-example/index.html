<title>Word counter: on step 5</title>
<meta name="card" content='{"w":1100}' />
<style>
	.doc { --ok-soft: color-mix(in srgb, var(--b-ok) 14%, transparent); --bad-soft: color-mix(in srgb, var(--b-danger) 12%, transparent);
		font-size: 17px; line-height: 1.4; color: var(--b-fg); font-family: var(--b-font) }

	.head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 16px; padding: 18px 22px 14px; border-bottom: 1px solid var(--b-border) }
	.head h1 { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -0.01em }
	.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--b-muted) }
	.who b { color: var(--b-fg); font-weight: 600 }
	.who .stale { color: var(--b-warn); font-weight: 600 }
	.face { display: grid; width: 30px; height: 30px }
	.face > * { grid-area: 1 / 1 }
	.face img { width: 30px; height: 30px; border-radius: 8px; display: block; object-fit: cover }
	.face .dot { justify-self: end; align-self: end; margin: 0 -3px -3px 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--b-bg); background: var(--b-faint) }
	.face .dot.on { background: var(--b-ok); animation: pulse 1.8s infinite }
	@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--b-ok) 60%, transparent) } 100% { box-shadow: 0 0 0 7px transparent } }
	.segs { grid-column: 1 / -1; display: flex; gap: 4px }
	.segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--b-border) }
	.segs i.done { background: var(--b-ok) } .segs i.blocked, .segs i.not { background: var(--b-danger) }
	.segs i.active { background: linear-gradient(90deg, var(--b-accent) 40%, var(--b-border) 40%) }

	.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 39% 1fr; grid-template-rows: minmax(0, 1fr) }
	.steps { overflow: auto; padding: 10px; border-right: 1px solid var(--b-border); background: var(--b-bg-layer); display: flex; flex-direction: column; gap: 7px }
	.step { display: grid; grid-template-columns: 24px 1fr; column-gap: 10px; text-align: left; font: inherit; color: var(--b-fg); background: var(--b-bg); border: 1px solid var(--b-border); border-radius: 10px; padding: 9px 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s }
	.step:hover { border-color: var(--b-border-strong) }
	.step[aria-pressed="true"] { border-color: var(--b-accent); box-shadow: 0 0 0 3px var(--b-accent-soft) }
	.step > :not(.num) { grid-column: 2 }
	.num { grid-row: 1 / span 4; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--b-bg-deep); color: var(--b-muted) }
	.step.done .num { background: var(--ok-soft); color: var(--b-ok) }
	.step.active .num { background: var(--b-accent); color: #fff }
	.step.blocked .num, .step.not .num { background: var(--bad-soft); color: var(--b-danger) }
	.t { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; line-height: 1.3 }
	.row { margin-top: 4px; font-size: 14px; line-height: 1.4; color: var(--b-muted) }
	.row b { font-weight: 600; color: var(--b-fg); margin-right: 5px }
	.pill { font-size: 14px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap }
	.pill.done { background: var(--ok-soft); color: var(--b-ok) }
	.pill.active { background: var(--b-accent-soft); color: var(--b-accent) }
	.pill.blocked, .pill.not { background: var(--bad-soft); color: var(--b-danger) }
	.pill.todo { background: var(--b-bg-deep); color: var(--b-muted) }

	.log { overflow: auto; padding: 0 18px 14px }
	.sep { position: sticky; top: 0; z-index: 1; background: var(--b-bg); padding: 12px 0 6px; font-size: 14px; font-weight: 700; color: var(--b-muted); display: flex; gap: 8px; align-items: center }
	.sep::after { content: ""; flex: 1; height: 1px; background: var(--b-border) }
	.e > .x { min-width: 0 }
	.e { display: grid; grid-template-columns: 46px 20px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 8px; border-radius: 8px; font-size: 15px; line-height: 1.4 }
	.e + .e { margin-top: 3px }
	.e.lit { background: var(--b-accent-soft) }
	.at { color: var(--b-faint); font-family: var(--b-mono); font-size: 14px; padding-top: 2px }
	.ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; line-height: 1; margin-top: 1px }
	.run .ic { background: var(--b-bg-deep); color: var(--b-muted); border: 1px solid var(--b-border) }
	.run.running .ic { background: var(--b-accent); color: #fff; border: 0 }
	.result .ic { background: var(--ok-soft); color: var(--b-ok) }
	.fail .ic { background: var(--bad-soft); color: var(--b-danger) }
	.finding .ic, .note .ic { background: var(--b-accent-soft); color: var(--b-accent) }
	.term { font-family: var(--b-mono); font-size: 14px; background: var(--b-bg-deep); border: 1px solid var(--b-border); border-radius: 7px; padding: 6px 10px; word-break: break-all; display: inline-block }
	.term::before { content: "$ "; color: var(--b-faint) }
	.why { display: block; font-size: 14px; color: var(--b-muted); margin-top: 3px }
	.result .x { font-weight: 600; color: var(--b-ok) }
	.fail .x { color: var(--b-danger) }
	.finding .x { border-left: 3px solid var(--b-accent); padding-left: 10px; font-weight: 550 }
	.finding .x small { display: block; font-size: 14px; font-weight: 600; color: var(--b-accent) }
	.prog { display: flex; align-items: center; gap: 10px; margin-top: 7px; font-size: 14px; color: var(--b-muted) }
	.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--b-border); overflow: hidden }
	.bar i { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; background: var(--b-accent) }
	.running .bar i { background: repeating-linear-gradient(-45deg, var(--b-accent) 0 8px, color-mix(in srgb, var(--b-accent) 75%, white) 8px 16px); background-size: 22px 22px; animation: stripes 1s linear infinite }
	@keyframes stripes { to { background-position: 22px 0 } }

	.ask { margin: 12px 22px 0; border: 1px solid var(--b-accent); background: var(--b-accent-soft); border-radius: 10px; padding: 10px 14px }
	.ask p { margin: 0 0 8px; font-weight: 600 }
	.ask button { font: 15px var(--b-font); min-height: 40px; padding: 6px 14px; margin: 0 8px 0 0; border-radius: 8px; border: 1px solid var(--b-border-strong); background: var(--b-bg); color: var(--b-fg); cursor: pointer }
	.ask button[disabled] { opacity: .6; cursor: default }
	.empty { color: var(--b-muted); padding: 14px 0 }
	/* Edge to edge, in a 16:10 shape, its two panes scrolling inside. Decks's own styles sit in a layer
	   beneath these, so this rule replaces its padding and display outright. */
	.doc { display: flex; flex-direction: column; aspect-ratio: 16 / 10; overflow: hidden; padding: 0; font-size: 17px; line-height: 1.4 }
	@container card (width < 760px) { .doc { aspect-ratio: auto } .cols { grid-template-columns: 1fr } .steps, .log { height: 300px } }
</style>
<style>
	/* What an entry's own HTML can use (templates/ shows each). */
	.viz { box-sizing: border-box; max-width: 100%; min-width: 0; overflow: hidden; color: var(--b-fg); font-weight: 400; margin-top: 8px; border: 1px solid var(--b-border); border-radius: 8px; background: var(--b-bg); padding: 10px 12px; font-size: 14px }
	.viz .cap { color: var(--b-muted); margin-top: 6px }
	.viz .words { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px }
	.viz .w { padding: 1px 7px; border-radius: 5px; font-family: var(--b-mono); font-size: 14px }
	.viz .tally b { font-weight: 600 }
	.viz .tally { display: grid; grid-template-columns: max-content 1fr max-content; gap: 3px 8px; align-items: center }
	.viz .tally .bar { height: 8px; border-radius: 4px }
	.viz .blocks { display: flex; flex-wrap: wrap; gap: 3px }
	.viz .blocks i { width: 14px; height: 14px; border-radius: 3px; background: color-mix(in srgb, var(--b-ok) 70%, transparent) }
	.viz .blocks i.fail { background: var(--b-danger) } .viz .blocks i.skip { background: var(--b-border-strong) }
	.viz .failing { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px }
	.viz .failing li { display: flex; gap: 8px; align-items: baseline }
	.viz .failing li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--b-danger); transform: translateY(1px) }
	.viz .failing small, .viz small { font-size: 14px; color: var(--b-muted) }
	.viz .cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 10px; line-height: 1.1 }
	.viz .ex { margin-top: 8px; font-family: var(--b-mono); color: var(--b-muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
	.viz svg { display: block; width: 100%; height: auto; overflow: visible }
	.viz svg text { font: 16px var(--b-font); fill: var(--b-muted) }
	.viz svg .lab { fill: var(--b-fg) }
	.viz img { max-width: 100%; border-radius: 6px; display: block }
	.viz .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
	.viz .compare > div { border: 1px solid var(--b-border); border-radius: 6px; padding: 8px 10px }
	.viz .compare .big { font-size: 24px; font-weight: 650; line-height: 1.2 }
	.viz .code-ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
	.viz .code-ba > div { border: 1px solid var(--b-border); border-radius: 6px; padding: 8px 10px; min-width: 0 }
	.viz .tree { font-family: var(--b-mono); font-size: 14px; line-height: 1.6; margin-top: 4px }
	.viz .tree .in { padding-left: 16px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline }
	.viz .tree .n { color: var(--b-muted) }
	.viz .tree .note { flex-basis: 100%; font-family: var(--b-font); color: var(--b-muted); padding-left: 2px }
	.viz .add { color: var(--b-ok) } .viz .add::before { content: "+ " }
	.viz .chg { color: var(--b-warn) } .viz .chg::before { content: "~ " }
	.viz .del { color: var(--b-danger); text-decoration: line-through }
	.viz .compare .side, .viz .code-ba .side { display: block; margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--b-muted) }
</style>
<div class="doc" data-id="doc">
	<div class="head">
		<h1 id="task">Loading the progress…</h1>
		<span class="who" id="who"></span>
		<div class="segs" id="segs"></div>
	</div>
	<div id="asks"></div>
	<div class="cols">
		<div class="steps" id="steps" data-id="steps"></div>
		<div class="log" id="log" data-id="log"></div>
	</div>
</div>
<script type="module">
	// A progress card. Left: the steps, each a goal or hypothesis, a method and what is expected. Right:
	// a log of what actually happened (commands, failures, findings, results) under each step, newest at
	// the foot. It reads progress.json beside it every 4 seconds; the agent, or a script it runs, rewrites
	// that file in place. Copy the folder and change anything: the JSON's shape is this card's own.
	// A log entry can carry its own HTML under it: "html" inline, or "file", an .html piece in this
	// folder (log/bench.html). templates/ holds pieces to copy: a tally, test blocks, a word cloud, a
	// waterfall trace, bars, before and after. Scripts in a piece do not run; SVG and CSS do.
	const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
	const VERDICT = { held: "done", "not held": "not", blocked: "blocked" };
	const stateOf = (step) => (step.verdict && VERDICT[step.verdict]) || (step.status === "active" ? "active" : step.status === "done" ? "done" : step.status === "blocked" ? "blocked" : "todo");
	const pillOf = (step) => step.badge ?? step.verdict ?? ({ active: "running", done: "done", blocked: "blocked", todo: "to do" })[stateOf(step)];
	const ICON = { run: "›", result: "✓", fail: "✕", finding: "!", note: "·" };
	const minutesSince = (iso) => (Date.now() - Date.parse(iso)) / 60000;

	export default function (card) {
		const $ = (id) => card.root.getElementById(id);
		let text = "", data = null, pieces = {}, chosen = null, follow = true, face = { name: "", src: "" };

		async function faceOf(name) {
			if (!name || face.name === name) return;
			face = { name, src: "" };
			try {
				const agent = await card.decks.agent.get(name);
				face.src = agent?.avatar ?? "";
			} catch {}
			drawHead();
		}

		function drawHead() {
			const steps = data.steps ?? [];
			const active = steps.findIndex((s) => s.status === "active");
			const done = steps.filter((s) => s.status === "done").length;
			const where = data.status === "done" ? `done in ${steps.length} steps` : active >= 0 ? `on step ${active + 1}` : `${done} steps done`;
			$("task").textContent = `${data.task ?? "Progress"}: ${where}`;
			const age = data.updated ? minutesSince(data.updated) : NaN;
			const working = data.status !== "done" && data.status !== "waiting";
			const stale = working && age > 10;
			const when = Number.isFinite(age) ? (age < 1 ? "updated just now" : `updated ${Math.round(age)} min ago`) : "";
			$("who").innerHTML = `<span class="face">${face.src ? `<img src="${esc(face.src)}" alt="" />` : ""}<span class="dot${working && !stale ? " on" : ""}"></span></span><b>${esc(data.agent ?? "")}</b>${when ? ` · ${stale ? `<span class="stale">no update for ${Math.round(age)} min</span>` : esc(when)}` : ""}${data.status === "waiting" ? " · waiting on you" : ""}`;
			$("segs").innerHTML = steps.map((s) => `<i class="${stateOf(s)}"></i>`).join("");
		}

		function drawAsks() {
			const asks = (data.questions ?? []).filter((q) => !q.answer);
			$("asks").innerHTML = asks.map((q, i) => `<div class="ask" data-id="ask-${i}"><p>${esc(q.ask)}</p>${(q.options ?? []).map((o) => `<button data-q="${i}">${esc(o)}</button>`).join("")}</div>`).join("");
			for (const b of $("asks").querySelectorAll("button")) b.addEventListener("click", async () => {
				const q = asks[Number(b.dataset.q)];
				for (const o of b.parentElement.querySelectorAll("button")) o.disabled = true;
				await card.decks.agent.send(q.agent ?? data.agent, { task: `${q.ask} ${b.textContent}`, cards: [card.path] });
			}, { signal: card.signal });
		}

		function drawSteps() {
			const steps = data.steps ?? [];
			$("steps").innerHTML = steps.map((s, i) => {
				const n = s.id ?? i + 1;
				const lead = s.hypothesis ? ["Hypothesis", s.hypothesis] : s.goal ? ["Goal", s.goal] : null;
				return `<button class="step ${stateOf(s)}" data-s="${esc(n)}" aria-pressed="${String(n) === String(chosen)}"><span class="num">${esc(n)}</span><div class="t">${esc(s.title)}<span class="pill ${stateOf(s)}">${esc(pillOf(s))}</span></div>${lead ? `<div class="row"><b>${lead[0]}</b>${esc(lead[1])}</div>` : ""}${s.method ? `<div class="row"><b>Method</b>${esc(s.method)}</div>` : ""}${s.expect ? `<div class="row"><b>Expect</b>${esc(s.expect)}</div>` : ""}</button>`;
			}).join("");
		}

		function entry(e) {
			const kind = ICON[e.kind] ? e.kind : "note";
			const running = kind === "run" && e.status === "running";
			let body;
			if (kind === "run") {
				const bar = e.of ? `<span class="prog"><span class="bar"><i style="width:${Math.min(100, (100 * (e.done ?? 0)) / e.of)}%"></i></span><span>${esc(e.done ?? 0)} of ${esc(e.of)}${e.unit ? ` ${esc(e.unit)}` : ""}</span></span>` : "";
				body = `${e.command ? `<span class="term">${esc(e.command)}</span>` : ""}${e.why ? `<span class="why">${esc(e.why)}</span>` : ""}${e.text ? `<span class="why">${esc(e.text)}</span>` : ""}${bar}`;
			} else if (kind === "finding") body = `<small>Finding</small>${esc(e.text)}`;
			else body = esc(e.text);
			const own = e.file ? pieces[e.file] : e.html;
			if (own) body += `<div class="viz">${own}</div>`;
			return `<div class="e ${kind}${running ? " running" : ""}${String(e.step) === String(chosen) ? " lit" : ""}" data-s="${esc(e.step)}"><span class="at">${esc(e.at ?? "")}</span><span class="ic">${ICON[kind]}</span><span class="x">${body}</span></div>`;
		}

		function drawLog() {
			const log = $("log");
			const atFoot = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
			const groups = [];
			for (const e of data.log ?? []) {
				const last = groups[groups.length - 1];
				if (last && String(last.step) === String(e.step)) last.items.push(e);
				else groups.push({ step: e.step, items: [e] });
			}
			const title = (n) => (data.steps ?? []).find((s, i) => String(s.id ?? i + 1) === String(n))?.title;
			log.innerHTML = groups.length ? groups.map((g) => `<div class="grp"><div class="sep" data-s="${esc(g.step)}">Step ${esc(g.step)}${title(g.step) ? `: ${esc(title(g.step))}` : ""}</div>${g.items.map(entry).join("")}</div>`).join("") : `<p class="empty">Nothing run yet.</p>`;
			if (follow || atFoot) glide(log, log.scrollHeight - log.clientHeight);
		}

		/** Scroll a pane to `top`: a glide when it is within about a screen and a half, a jump when farther. */
		function glide(pane, top) {
			const near = Math.abs(top - pane.scrollTop) < pane.clientHeight * 1.5;
			pane.scrollTo({ top, behavior: near ? "smooth" : "instant" });
		}

		/** Keep the chosen step in view in the steps pane. */
		function showChosen() {
			const pane = $("steps"), b = pane.querySelector(`[data-s="${CSS.escape(String(chosen))}"]`);
			if (!b) return;
			const top = b.offsetTop - pane.offsetTop;
			if (top < pane.scrollTop || top + b.offsetHeight > pane.scrollTop + pane.clientHeight) pane.scrollTop = top + b.offsetHeight - pane.clientHeight + 10;
		}

		function draw() {
			const steps = data.steps ?? [];
			const first = chosen === null;
			if (chosen === null || follow) {
				const active = steps.findIndex((s) => s.status === "active");
				const i = active >= 0 ? active : steps.length - 1;
				chosen = steps[i] ? (steps[i].id ?? i + 1) : null;
			}
			drawHead(); drawAsks(); drawSteps(); drawLog();
			if (first || follow) {
				// The panes take their height from the card's 16:10 shape, which settles after this draw.
				const settle = () => { showChosen(); if (follow) $("log").scrollTop = $("log").scrollHeight; };
				settle(); requestAnimationFrame(settle); setTimeout(settle, 300);
			}
			faceOf(data.agent);
		}

		$("steps").addEventListener("click", (event) => {
			const b = event.target.closest("button[data-s]");
			if (!b) return;
			chosen = b.dataset.s;
			follow = false;
			drawSteps(); drawLog();
			const head = $("log").querySelector(`.sep[data-s="${CSS.escape(chosen)}"]`);
			if (head) glide($("log"), head.parentElement.offsetTop - $("log").offsetTop);
		}, { signal: card.signal });
		// Following the newest line stops when the reader scrolls up, and starts again at the foot. Only the
		// reader's own scrolling counts: the panes resizing as the card settles scrolls the log too.
		let reading = false;
		for (const type of ["wheel", "touchstart", "pointerdown", "keydown"]) $("log").addEventListener(type, () => (reading = true), { signal: card.signal, passive: true });
		$("log").addEventListener("scroll", () => {
			if (!reading) return;
			const log = $("log");
			follow = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
		}, { signal: card.signal });

		async function read(name) {
			const res = await fetch(card.file(name), { cache: "no-store", signal: card.signal });
			return res.ok ? res.text() : "";
		}

		async function load() {
			let changed = false;
			try {
				const next = await read("progress.json");
				if (next !== text) {
					const parsed = JSON.parse(next); // half-written: keep the last good one
					text = next; data = parsed; changed = true;
				}
			} catch (error) {
				if (error.name === "AbortError") return;
			}
			if (!data) return;
			// An entry's own HTML file is read again too, so editing it shows without touching the JSON.
			for (const name of new Set((data.log ?? []).map((e) => e.file).filter(Boolean))) {
				try {
					const piece = await read(name);
					if (piece !== pieces[name]) { pieces[name] = piece; changed = true; }
				} catch (error) { if (error.name === "AbortError") return; }
			}
			if (!changed) { drawHead(); return; }
			try { draw(); } catch (error) { $("task").textContent = `progress.json could not be drawn: ${error.message}`; }
		}
		load();
		const timer = setInterval(load, 4000);
		return () => clearInterval(timer);
	}
</script>
