<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>@decks/canvas demo</title>
		<style>
			html, body { height: 100%; margin: 0; }
			/* The canvas fills the window from its corner (the stage's pixels are the page's: `camera/coords.ts`), and the demo's bar floats over it. */
			#canvas { position: fixed; inset: 0; }
			#bar { position: fixed; z-index: 50; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 6px 10px; font: 12px/1.4 system-ui, sans-serif; border: 1px solid #ddd; border-radius: 10px; background: rgb(255 255 255 / 92%); box-shadow: 0 2px 10px rgb(0 0 0 / 8%); }
			#bar output { color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
		</style>
	</head>
	<body>
		<div id="bar">
			<strong>@decks/canvas</strong>
			<button id="mode" type="button">Browse</button>
			<button id="ink" type="button">Ink</button>
			<button id="dark" type="button">Dark</button>
			<output id="edits">no edits yet</output>
		</div>
		<div id="canvas"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
