<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Auth incident report (Q2)</title>
		<style>
			body { margin: 0; padding: 20px; background: #fff; color: #161616;
				font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
			h1 { margin: 0 0 4px; font-size: 18px; }
			.meta { color: #808080; font-size: 12px; margin-bottom: 16px; }
			table { border-collapse: collapse; width: 100%; font-size: 13px; }
			th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
			th { color: #5c5c5c; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
			.n { text-align: right; font-variant-numeric: tabular-nums; }
			#origin { margin-top: 16px; padding: 8px 10px; border-radius: 6px;
				background: #fcefd0; color: #ac8833; font-size: 12px; }
		</style>
	</head>
	<body>
		<h1>Auth incident report</h1>
		<div class="meta">Exported from the incident tracker — not written by the agent.</div>
		<table>
			<thead><tr><th>Week</th><th class="n">Failed refreshes</th><th class="n">Users affected</th></tr></thead>
			<tbody>
				<tr><td>2026-04-06</td><td class="n">1,204</td><td class="n">311</td></tr>
				<tr><td>2026-04-13</td><td class="n">1,890</td><td class="n">402</td></tr>
				<tr><td>2026-04-20</td><td class="n">2,455</td><td class="n">517</td></tr>
				<tr><td>2026-04-27</td><td class="n">2,102</td><td class="n">488</td></tr>
			</tbody>
		</table>

		<!--
			This page stands in for a document that came from somewhere else, and it
			reports what it can reach: inside a board it is a nested sandboxed frame in
			an opaque origin, so `origin` reads "null" and touching the app's storage
			throws. That line is the quarantine (DESIGN §4) proving itself on screen.
		-->
		<div id="origin">checking…</div>
		<script>
			(() => {
				/*
				 * `window.origin`, not `location.origin`: in a document with an opaque
				 * origin Chromium still reports the URL's origin from `location`, while
				 * `window.origin` says "null" — which is the thing actually being
				 * demonstrated. The storage check below is the same fact from the other
				 * side, and it is the one that cannot be argued with.
				 */
				const parts = [`origin: ${window.origin}`];
				try {
					localStorage.length;
					parts.push("localStorage: reachable");
				} catch (error) {
					parts.push("localStorage: blocked");
				}
				parts.push(`scripts: running (${new Date().getFullYear()})`);
				document.getElementById("origin").textContent = parts.join(" · ");
			})();
		</script>
	</body>
</html>
